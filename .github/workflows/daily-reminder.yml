name: Daily batch reminder

# Runs once a day and on-demand to remind batch owners of steps due today, and
# fills in the dated checklist when a new batch issue is opened via the form.
#
# The cron below fires at 05:30 UTC, which is 07:00 in Europe/Copenhagen
# (06:00 during DST) - the default reminder timezone. If your batches use a
# different timezone, set the repo variable FERMENT_TZ to any IANA zone name
# (e.g. "America/New_York") - tools/ferment reads it to compute "today" for
# schedules and comments - and adjust the cron time below to match your
# preferred local hour.
on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch: {}
  issues:
    types: [opened]

permissions:
  issues: write
  contents: read

jobs:
  ensure-label:
    runs-on: ubuntu-latest
    steps:
      - name: Ensure the "batch" label exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create batch \
            --repo "${{ github.repository }}" \
            --color "6f4e37" \
            --description "A fermentation batch in progress" \
            --force

  fill-new-batch:
    if: github.event_name == 'issues'
    needs: ensure-label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fill in the dated checklist for the new batch
        env:
          GH_TOKEN: ${{ github.token }}
          FERMENT_TZ: ${{ vars.FERMENT_TZ }}
        run: |
          if gh issue view "${{ github.event.issue.number }}" --json labels \
              --jq '.labels[].name' | grep -qx batch; then
            python3 tools/ferment fill-batch "${{ github.event.issue.number }}"
          else
            echo "not a batch issue, skipping"
          fi

  remind:
    if: github.event_name != 'issues'
    needs: ensure-label
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Comment on batches with something due today
        env:
          GH_TOKEN: ${{ github.token }}
          FERMENT_TZ: ${{ vars.FERMENT_TZ }}
        run: python3 tools/ferment remind
